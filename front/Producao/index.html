<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimentações</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Movimentações de Estoque</h1>
        <div class="botoes">
            <button onclick="principal()">Tela Principal</button>
            <button onclick="sair()">Sair</button>
        </div>
    </header>
    <main class="container">
        <section class="card">
            <h2>Cadastrar Movimentação</h2>
            <form id="formMovimentacao">
                <div class="campo">
                    <label for="produto">Produto</label>
                    <select id="produto" required>
                        <option value="">Selecione um produto</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="status">Movimentação</label>
                    <select id="status" required>
                        <option value="">Selecione</option>
                        <option value="PEDIDO">Pedido</option>
                        <option value="PRODUZIDO">Produzido</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input type="number" id="quantidade" min="1" required>
                </div>
                <div class="campo">
                    <label for="data">Data da movimentação</label>
                    <input type="date" id="data" required>
                </div>
                <button type="submit"> Cadastrar </button>
            </form>
        </section>
        <section class="card">
            <h2>Movimentações</h2>
            <table>
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Tipo</th>
                        <th>Quantidade</th>
                        <th>Data</th>
                    </tr>
                </thead>
                <tbody id="tabelaMovimentacoes"></tbody>
            </table>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
